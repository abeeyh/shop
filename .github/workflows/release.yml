# docs/13 §6: release-please na main; depois da release, back-merge main → hom e main → dev
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  back-merge:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Abrir PRs main → hom e main → dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for base in hom dev; do
            gh pr create --repo "${{ github.repository }}" --base "$base" --head main \
              --title "chore: back-merge $TAG para $base" \
              --body "Sincroniza $base com a release $TAG (docs/13 §5). Merge commit, sem squash." \
              || echo "Nada a sincronizar em $base ou PR já aberto."
          done
