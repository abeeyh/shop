<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — protótipo minimalista (#98)</title>
<!-- Protótipo de design (#98). NÃO é código do produto: o JS só simula navegação e preço para avaliar o visual
     e o número de cliques. Tokens = docs/11-design.md. Catálogo = scripts/catalog/products.json (132 itens). -->
<style>
:root{
  --background:#080326;--card:#110d2e;--input:#0f0935;--border:#ffffff1a;
  --primary:#2f63e6;--primary-hover:#2556cc;--primary-foreground:#fff;
  --link:#6b95ff;--ring:#6b95ff;--g1:#fc466b;--g2:#3f5efb;
  --heading:#fff;--foreground:#cecdd4;--muted:#9c9aa8;--muted-bg:#ffffff14;--accent:#ffffff1f;
  --error:#f43f5e;--radius:15px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.5 Mulish,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--heading);margin:0;line-height:1.2}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- cabeçalho: uma linha + faixa de abas ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font:700 18px Inter,system-ui;color:var(--heading)}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;font-style:normal;font-size:14px}
.search{flex:1;max-width:460px;margin:0 auto;position:relative}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--input);color:var(--heading);padding:0 16px 0 40px;font:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:12px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:none;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--accent)}
.badge-count{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;max-width:1100px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:34px;display:flex;align-items:center}
.tab:hover{color:var(--heading);background:var(--muted-bg)}
.tab[aria-current=page]{color:var(--heading);background:var(--accent)}
@media (max-width:640px){
  .bar{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}
  .bar .search{order:3;flex-basis:100%;max-width:none}
  .logo{margin-right:auto}
}
.pop{position:absolute;right:0;top:48px;width:260px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:grid;gap:10px;box-shadow:0 20px 40px #0008}
.pop label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.wrap-pop{position:relative}

/* ---------- átomos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;font-weight:700;font-size:14px;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:var(--muted-bg);color:var(--heading)}.btn-ghost:hover{background:var(--accent)}
.btn-lg{height:48px;font-size:16px;padding:0 22px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--muted-bg);color:var(--foreground)}
.tag.hot{background:linear-gradient(90deg,#fc466b33,#3f5efb33);color:var(--heading)}
.tag.warn{color:#ffb4c2;background:#e11d4826}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--heading)}
.input,select.input{height:44px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:var(--heading);padding:0 12px;font:inherit;width:100%}
.input[aria-invalid=true]{border-color:var(--error)}
.err{color:var(--error);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--input);font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:var(--heading)}
.seg label:has(input:checked){border-color:var(--link);background:#2f63e626}
.seg label:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}

/* ---------- seções ---------- */
main{min-height:70vh;padding-bottom:64px}
.hero{padding-top:44px;padding-bottom:20px;display:grid;gap:14px}
.hero h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.cat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--border);font-weight:600;color:var(--heading);font-size:14px}
.cat:hover{background:var(--muted-bg)}
.ico{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#fc466b33,#3f5efb33);color:var(--heading)}
.section{margin-top:40px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{font-size:20px}
.section-head a{color:var(--link);font-size:14px;font-weight:600}

/* ---------- lista de produtos (substitui o card-pôster) ---------- */
.list{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--border);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--muted-bg)}
.row .name{color:var(--heading);font-weight:700;font-size:15px}
.row .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.row .desc{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52ch}
.price{font:700 16px Inter,system-ui;color:var(--heading);text-align:right;white-space:nowrap}
.price small{display:block;font:400 12px Mulish,system-ui;color:var(--muted)}
@media (max-width:640px){
  .row{grid-template-columns:36px 1fr auto;row-gap:8px}
  .row .btn{display:none}
  .row .desc{white-space:normal}
}
.subtabs{position:sticky;top:105px;z-index:10;background:var(--background);display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
@media (max-width:640px){.subtabs{top:154px}}
.subtab{flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--foreground);background:none;min-height:36px}
.subtab[aria-pressed=true]{background:var(--heading);color:var(--background);border-color:var(--heading)}
.group-title{font-size:15px;color:var(--muted);font-weight:600;margin:22px 0 8px;scroll-margin-top:170px}
.page-head{padding:28px 0 4px;display:grid;gap:6px}
.page-head h1{font-size:clamp(24px,4vw,32px)}

/* ---------- próximas raids ---------- */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.slot{border:1px solid var(--border);border-radius:12px;padding:14px;display:grid;gap:4px;background:var(--card);text-align:left}
.slot:hover{background:#ffffff0a}
.slot .when{color:var(--heading);font-weight:700}

/* ---------- gaveta de compra ---------- */
.scrim{position:fixed;inset:0;background:#0009;z-index:40}
.drawer{position:fixed;z-index:41;background:var(--card);border-left:1px solid var(--border);top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;animation:in .18s ease-out}
.drawer-body{padding:20px;overflow:auto;display:grid;gap:16px;align-content:start;flex:1}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--border);display:grid;gap:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;color:var(--heading);font-weight:700}
.total b{font:700 22px Inter,system-ui}
@keyframes in{from{transform:translateX(24px);opacity:0}}
@media (max-width:640px){
  .drawer{top:auto;left:0;width:100%;max-height:92vh;border-left:0;border-top:1px solid var(--border);border-radius:18px 18px 0 0;animation-name:up}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.qty{display:flex;align-items:center;gap:8px}
.qty .input{text-align:center;width:90px}
.note{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--muted-bg)}

/* ---------- carrinho / checkout ---------- */
.two{display:grid;gap:20px;grid-template-columns:1fr;margin-top:12px}
@media (min-width:900px){.two{grid-template-columns:1fr 340px;align-items:start}}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:18px;display:grid;gap:12px}
.line{display:flex;justify-content:space-between;gap:10px}
.empty{padding:40px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
footer{border-top:1px solid var(--border);padding:20px 0;font-size:13px;color:var(--muted)}
footer .container{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* ---------- só do protótipo ---------- */
.clicks:empty{display:none}
.clicks{position:fixed;left:12px;bottom:12px;z-index:30;background:#000c;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--heading)}
.clicks button{background:none;border:0;color:var(--link);padding:0 0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--heading);color:var(--background);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px}
</style>
</head>

</header>

  let s = " " + n + " ";
  const take = (re, label) => { const m = re.exec(s); if (m) { tags.push(typeof label === "function" ? label(m) : label); s = s.replace(re, " "); } };
  take(/\bMYTH(IC)?\b/i, "Mythic"); take(/\bHEROIC\b/i, "Heroic"); take(/\bNORMAL\b/i, "Normal");
  take(/\(VIP\)/i, "VIP");
  take(/\bUNSAVED\b/i, "Unsaved"); take(/\bSAVED\b/i, "Saved");
  take(/\bFP\s?(\d+)\b/i, (m) => `FP ${m[1]}`); take(/\bATP\s?(\d+)\b/i, (m) => `ATP ${m[1]}`);
  take(/\+\s?TG(\s+FREE)?\b/i, (m) => (m[1] ? "Tidebound grátis" : "+ Tidebound"));
  s = s.replace(/\bFP\b/gi, " ").replace(/\s+/g, " ").replace(/\s*\+\s*$/, "").trim()
    .split(" ").map((w) => (w.length > 3 && w === w.toUpperCase() && /[A-Z]/.test(w) && !ACRO.has(w) ? w[0] + w.slice(1).toLowerCase() : w)).join(" ");
  return { title: s || n, tags };
}
const HOT = new Set(["KSM M", "All 3 Raids FP MYTH", "Venomous Abyss 8/8 SAVED HEROIC", "Bundles 4x M+10 Keys"]);
const PRODUCTS = [
  { id: "gold", c: "gold", title: "Gold — US realms", tags: [], d: "Preço por 1.000 gold. Mínimo 100k.", p: 45, gold: true, hot: true, o: 0 },
  ...RAW.map((r, i) => ({ id: "p" + i, c: r.c, s: r.s, ...parse(r.n), d: r.d, p: r.p, a: r.a, q: r.q, o: r.o, hot: HOT.has(r.n) })),
];
const byId = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));
const SLOTS = [
  { id: PRODUCTS.find((p) => p.title.startsWith("Venomous Abyss 8/8") && p.tags.includes("Heroic"))?.id, when: "Sáb, 7 nov · 22:00", left: 10 },
  { id: PRODUCTS.find((p) => p.title.startsWith("Venomous Abyss") && p.tags.includes("Normal"))?.id, when: "Sáb, 7 nov · 22:00", left: 0 },
  { id: PRODUCTS.find((p) => p.title.startsWith("Venomous Abyss 8/8") && p.tags.includes("Heroic"))?.id, when: "Dom, 8 nov · 22:00", left: 9 },
];

// ---------- estado (só do protótipo) ----------
const state = { cart: [], clicks: 0, sub: null };
const $ = (s) => document.querySelector(s);
function go(h) { location.hash = h; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.role = "status"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }
function renderClicks() {
  if (new URLSearchParams(location.search).has("clean")) return;
  $("#clicks").innerHTML = `Cliques nesta compra: <b>${state.clicks}</b><button onclick="state.clicks=0;renderClicks()">zerar</button>`;
}
document.addEventListener("click", (e) => { if (e.target.closest("a,button,.row,.slot") && !e.target.closest(".clicks")) { state.clicks++; renderClicks(); } }, true);
function togglePop(b) { const p = $("#pop"); p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); }

// ---------- peças ----------
const tagHtml = (p) => [p.hot ? '<span class="tag hot">Popular</span>' : "", ...p.tags.map((t) => `<span class="tag">${esc(t)}</span>`)].join("");
const priceHtml = (p) => p.p == null ? `<div class="price">Sob consulta</div>` : `<div class="price">${usdt(p.p)}${p.gold ? "<small>por 1.000 gold</small>" : p.a ? `<small>+${p.a}% Armor Stack</small>` : p.q > 1 ? "<small>por tier</small>" : ""}</div>`;
const catOf = (slug) => CATS.find((c) => c.slug === slug);
function row(p) {
  return `<div class="row" role="button" tabindex="0" data-buy="${p.id}" aria-label="${esc(p.title)}">
    <span class="ico">${icon(catOf(p.c).icon)}</span>
    <div><div class="name">${esc(p.title)}</div><div class="meta">${tagHtml(p)}</div>${p.d ? `<div class="desc">${esc(p.d)}</div>` : ""}</div>
    ${priceHtml(p)}
    <button class="btn ${p.p == null ? "btn-ghost" : "btn-primary"}" data-buy="${p.id}" tabindex="-1">${p.p == null ? "Consultar" : "Comprar"}</button>
  </div>`;
}
const list = (items) => `<div class="list">${items.map(row).join("")}</div>`;
const sorted = (items) => [...items].sort((a, b) => a.o - b.o);

// ---------- páginas ----------
function home() {
  const hot = PRODUCTS.filter((p) => p.hot);
  return `<section class="container hero">
      <h1>Seu progresso no WoW,<br>sem o grind.</h1>
      <p class="muted" style="margin:0;max-width:52ch">Gold, raids, Mythic+ e conquistas. Preço em USDT, horários no seu fuso.</p>
      <div class="cats">${CATS.map((c) => `<a class="cat" href="#/c/${c.slug}"><span class="ico">${icon(c.icon)}</span>${c.name}</a>`).join("")}</div>
    </section>
    <section class="container section">
      <div class="section-head"><h2>Próximas raids</h2><span class="small muted">no seu fuso (São Paulo)</span></div>
      <div class="slots">${SLOTS.filter((s) => s.id).map((s) => { const p = byId[s.id]; return `<button class="slot" data-buy="${p.id}" ${s.left ? "" : "disabled"}>
        <span class="when">${s.when}</span><span>${esc(p.title)} <span class="muted">· ${p.tags.join(" · ")}</span></span>
        <span class="small">${s.left ? `<span class="tag">${s.left} vagas</span>` : '<span class="tag warn">Esgotado</span>'} <b style="color:var(--heading);float:right">${usdt(p.p)}</b></span></button>`; }).join("")}</div>
    </section>
    <section class="container section">
      <div class="section-head"><h2>Mais vendidos</h2><a href="#/busca?q=">Ver todos →</a></div>
      ${list(hot)}
    </section>`;
}
function category(slug) {
  const c = catOf(slug); if (!c) return notFound();
  const items = sorted(PRODUCTS.filter((p) => p.c === slug));
  let body;
  if (c.subs) {
    body = `<div class="subtabs" role="toolbar" aria-label="Subcategorias">${c.subs.map(([s, n]) => `<button class="subtab" aria-pressed="false" onclick="jump('${s}',this)">${n} <span class="muted">${items.filter((p) => p.s === s).length}</span></button>`).join("")}</div>
      ${c.subs.map(([s, n]) => `<h2 class="group-title" id="g-${s}">${n}</h2>${list(items.filter((p) => p.s === s))}`).join("")}`;
  } else body = `<div style="margin-top:16px">${list(items)}</div>`;
  return `<div class="container"><div class="page-head"><h1>${c.name}</h1><p class="muted" style="margin:0">${c.desc} · ${items.length} serviços</p></div>${body}</div>`;
}
function jump(s, b) { document.querySelectorAll(".subtab").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); document.getElementById("g-" + s).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" }); }
function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = PRODUCTS.filter((p) => { const h = (p.title + " " + p.tags.join(" ") + " " + (p.d || "") + " " + catOf(p.c).name).toLowerCase(); return words.every((w) => h.includes(w)); });
  $("#q").value = q;
  return `<div class="container"><div class="page-head"><h1>${q ? `Resultados para “${esc(q)}”` : "Todos os serviços"}</h1><p class="muted" style="margin:0">${hit.length} serviços</p></div>
    <div style="margin-top:16px">${hit.length ? list(hit.slice(0, 60)) : `<div class="panel empty"><p>Nada encontrado. Tente “raid heroic” ou “KSM”.</p><a class="btn btn-ghost" href="#/c/raids">Ver raids</a></div>`}</div></div>`;
}
const lineTotal = (it) => it.unit * it.qty;
function cart() {
  if (!state.cart.length) return `<div class="container"><div class="page-head"><h1>Carrinho</h1></div><div class="panel empty"><p>Seu carrinho está vazio.</p><a class="btn btn-primary" href="#/">Ver serviços</a></div></div>`;
  const total = state.cart.reduce((s, it) => s + lineTotal(it), 0);
  return `<div class="container"><div class="page-head"><h1>Carrinho</h1></div><div class="two">
    <div class="list">${state.cart.map((it, i) => `<div class="row" style="cursor:default"><span class="ico">${icon(catOf(byId[it.id].c).icon)}</span>
      <div><div class="name">${esc(byId[it.id].title)}</div><div class="desc">${esc(it.summary)}</div></div>
      <div class="price">${usdt(lineTotal(it))}</div><button class="btn btn-ghost" onclick="state.cart.splice(${i},1);sync();route()">Remover</button></div>`).join("")}</div>
    <aside class="panel"><div class="total"><span>Total</span><b>${usdt(total)}</b></div>
      <details><summary class="small muted" style="cursor:pointer">Tenho um cupom</summary><div style="display:flex;gap:6px;margin-top:8px"><input class="input" aria-label="Cupom"><button class="btn btn-ghost">Aplicar</button></div></details>
      <a class="btn btn-primary btn-lg btn-block" href="#/checkout">Finalizar compra</a></aside></div></div>`;
}
function checkout() {
  if (!state.cart.length) return cart();
  const total = state.cart.reduce((s, it) => s + lineTotal(it), 0);
  return `<div class="container"><div class="page-head"><h1>Pagamento</h1><p class="muted" style="margin:0">Último passo.</p></div><div class="two">
    <div class="panel"><label class="field"><span>E-mail para o pedido</span><input class="input" type="email" placeholder="voce@exemplo.com"></label>
      <div class="field"><span>Pagar com</span><div class="seg"><label><input type="radio" name="pay" checked><span>USDT</span></label><label><input type="radio" name="pay"><span>Cartão</span></label></div></div>
      <p class="note">Sem senha da Battle.net: você joga com o seu personagem.</p></div>
    <aside class="panel">${state.cart.map((it) => `<div class="line small"><span>${esc(byId[it.id].title)}${it.qty > 1 ? ` ×${it.qty}` : ""}</span><span>${usdt(lineTotal(it))}</span></div>`).join("")}
      <div class="total"><span>Total</span><b>${usdt(total)}</b></div>
      <button class="btn btn-primary btn-lg btn-block" onclick="toast('Fim do protótipo: aqui abre a fatura USDT')">Pagar ${usdt(total)}</button></aside></div></div>`;
}
const notFound = () => `<div class="container"><div class="panel empty"><p>Página não encontrada.</p><a class="btn btn-primary" href="#/">Início</a></div></div>`;

// ---------- gaveta de compra (ServiceOptionsDrawer) ----------
let lastFocus = null;
function openBuy(id) {
  const p = byId[id]; lastFocus = document.activeElement;
  if (p.p == null) { toast("Abre o chat com a mensagem: “Quero orçamento de " + p.title + "”"); return; }
  const qtyField = p.gold
    ? `<label class="field"><span>Quantidade (mil gold)</span><input class="input" id="b-qty" type="number" min="100" max="100000" step="100" value="100"></label>`
    : p.q > 1 ? `<label class="field"><span>Tiers</span><input class="input" id="b-qty" type="number" min="1" max="${p.q}" value="1"></label>` : "";
  $("#layer").innerHTML = `<div class="scrim" onclick="closeBuy()"></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="b-title">
    <form class="drawer-body" id="buy" novalidate onsubmit="event.preventDefault()">
      <div style="display:flex;gap:12px;align-items:start"><span class="ico">${icon(catOf(p.c).icon)}</span>
        <div style="flex:1"><h2 id="b-title" style="font-size:18px">${esc(p.title)}</h2><div class="meta" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${tagHtml(p)}</div></div>
        <button type="button" class="icon-btn" aria-label="Fechar" onclick="closeBuy()">✕</button></div>
      ${p.d ? `<p class="small muted" style="margin:0">${esc(p.d)}</p>` : ""}
      ${qtyField}
      <label class="field"><span>Realm</span><input class="input" id="b-realm" placeholder="ex.: Area 52" autocomplete="off"><span class="err" hidden>Informe o realm.</span></label>
      <div class="field"><span>Facção</span><div class="seg"><label><input type="radio" name="fac" value="Alliance" checked><span>Alliance</span></label><label><input type="radio" name="fac" value="Horde"><span>Horde</span></label></div></div>
      <label class="field"><span>Personagem</span><input class="input" id="b-char" placeholder="Nome no jogo" autocomplete="off"><span class="err" hidden>Só letras.</span></label>
      ${p.a ? `<label class="check"><input type="checkbox" id="b-addon"><span>Armor Stack <span class="muted">+${p.a}%</span></span></label>` : ""}
      ${p.gold ? "" : `<p class="note">${p.c.startsWith("raids") ? "Escolha o horário depois do pagamento, no chat com o suporte." : "Depois do pagamento, o suporte agenda a run com você pelo chat."}</p>`}
    </form>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><b id="b-total"></b></div>
      <button class="btn btn-primary btn-lg btn-block" onclick="addBuy('${id}',true)">Comprar agora</button>
      <button class="btn btn-ghost btn-block" onclick="addBuy('${id}',false)">Adicionar ao carrinho</button>
    </div>
  </div>`;
  const recalc = () => { $("#b-total").textContent = usdt(unitOf(p) * qtyOf(p)); };
  $("#buy").addEventListener("input", recalc); recalc();
  $("#b-realm").focus();
}
const qtyOf = (p) => (p.gold ? Math.max(100, +($("#b-qty")?.value || 100)) : Math.max(1, +($("#b-qty")?.value || 1)));
const unitOf = (p) => Math.round(p.p * (100 + ($("#b-addon")?.checked ? p.a : 0)) / 100);
function addBuy(id, now) {
  const p = byId[id], realm = $("#b-realm"), ch = $("#b-char");
  const bad = [[realm, realm.value.trim().length < 2], [ch, !/^\p{L}{2,12}$/u.test(ch.value.trim())]];
  bad.forEach(([el, b]) => { el.setAttribute("aria-invalid", b); el.nextElementSibling.hidden = !b; });
  const first = bad.find(([, b]) => b); if (first) { first[0].focus(); return; }
  const fac = document.querySelector("input[name=fac]:checked").value;
  state.cart.push({ id, qty: qtyOf(p), unit: unitOf(p), summary: `${realm.value.trim()} · ${fac} · ${ch.value.trim()}${$("#b-addon")?.checked ? " · Armor Stack" : ""}${p.gold ? ` · ${qtyOf(p)}k gold` : ""}` });
  sync(); closeBuy();
  if (now) go("#/checkout"); else toast("Adicionado ao carrinho");
}
function closeBuy() { $("#layer").innerHTML = ""; lastFocus?.focus?.(); }
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeBuy(); $("#pop").hidden = true; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".row[data-buy]")) { e.preventDefault(); openBuy(e.target.dataset.buy); }
  if (e.key === "Tab" && $(".drawer")) { const f = [...$(".drawer").querySelectorAll("input,button")].filter((x) => !x.disabled); const [a, z] = [f[0], f.at(-1)]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
document.addEventListener("click", (e) => { const b = e.target.closest("[data-buy]"); if (b && !b.disabled) openBuy(b.dataset.buy); if (!e.target.closest(".wrap-pop")) $("#pop").hidden = true; });

// ---------- roteador ----------
function sync() { const n = state.cart.length; const c = $("#cart-count"); c.hidden = !n; c.textContent = n; }
function route() {
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const parts = path.split("/").filter(Boolean);
  const html = !parts.length ? home() : parts[0] === "c" ? category(parts[1]) : parts[0] === "busca" ? search(new URLSearchParams(qs).get("q") || "")
    : parts[0] === "carrinho" ? cart() : parts[0] === "checkout" ? checkout() : notFound();
  $("#app").innerHTML = html;
  $("#tabs").innerHTML = CATS.map((c) => `<a class="tab" href="#/c/${c.slug}" ${parts[1] === c.slug ? 'aria-current="page"' : ""}>${c.name}</a>`).join("");
  if (parts[0] !== "busca") $("#q").value = "";
  if (!parts.length) { state.clicks = 0; renderClicks(); }
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); $("#app").focus({ preventScroll: true }); });
route(); renderClicks(); sync();
</script>
</body>
